<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="100%" height="100%">
  <!-- Crossed Fork & Spoon forming roof structure -->
  <g fill="#f59e0b" stroke="#f59e0b" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Roof / Fork Handle & Head -->
    <path d="M 40 130 L 150 35 L 160 45 L 60 140 Z" fill="#f59e0b" />
    <!-- Fork Prongs at the apex -->
    <path d="M 100 80 L 100 50 M 93 75 L 93 55 M 107 75 L 107 55 M 86 65 L 114 65" stroke="#f59e0b" stroke-width="4" />
    
    <!-- Right Roof / Spoon Handle & Bowl -->
    <path d="M 260 130 L 150 35 L 140 45 L 240 140 Z" fill="#f59e0b" />
    <!-- Spoon Bowl near apex -->
    <ellipse cx="205" cy="65" rx="14" ry="22" fill="#f59e0b" />
  </g>

  <!-- Stylized Branding Text: Kedai J.A -->
  <g font-family="'Plus Jakarta Sans', 'Arial Rounded MT Bold', sans-serif" font-weight="900" text-anchor="middle">
    <!-- Text Shadow / Glow -->
    <text x="150" y="145" font-size="52" fill="#090d16" stroke="#f59e0b" stroke-width="6" font-style="italic" letter-spacing="1">Kedai J.A</text>
    <text x="150" y="145" font-size="52" fill="#ffffff" font-style="italic" letter-spacing="1">Kedai J.A</text>
  </g>
</svg>
